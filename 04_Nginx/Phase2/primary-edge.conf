# TeamABS Phase 2 - Primary Nginx Edge Configuration
# Host: Mac 02 - Atharva Sharma (10.7.9.208)
# Roles: Primary Edge Reverse Proxy, TLS Termination, Upstream Health Detection

upstream teamabs_backends {
    server 10.7.21.236:3001 max_fails=1 fail_timeout=5s;
    server 10.7.16.91:3002 max_fails=1 fail_timeout=5s;
}

# Plaintext HTTP Reverse Proxy (Port 8080)
server {
    listen 8080;
    server_name app.teamabs.test api.teamabs.test;

    location / {
        proxy_pass http://teamabs_backends;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream Failover Directives (Extension D)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Pass through custom and caching headers emitted by backends
        proxy_pass_header X-Backend;
        proxy_pass_header ETag;
        proxy_pass_header Cache-Control;
    }
}

# Encrypted HTTPS Reverse Proxy with TLS Termination (Port 8443)
server {
    listen 8443 ssl;
    server_name app.teamabs.test api.teamabs.test;

    # Local certificate paths on Atharva's Mac (signed by TeamABS Root CA)
    ssl_certificate /opt/homebrew/etc/nginx/ssl/app.teamabs.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/app.teamabs.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://teamabs_backends;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream Failover Directives (Extension D)
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # Pass through custom and caching headers emitted by backends
        proxy_pass_header X-Backend;
        proxy_pass_header ETag;
        proxy_pass_header Cache-Control;
    }
}
